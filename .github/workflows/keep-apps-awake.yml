name: keep apps awake

# Visits the Streamlit apps every six hours so visitors land in the app instead of a "wake up" screen.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - run: python .github/scripts/keep_awake.py
      # GitHub pauses scheduled workflows after 60 days without repository activity; re-enabling keeps it on.
      - name: Keep the schedule active
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-apps-awake.yml/enable"
